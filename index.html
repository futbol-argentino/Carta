<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Me enamoré de vos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2516; --red:#8f2b22; --blue:#3a6591; --gold:#d9a93f;
  --leather-tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='l' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.075' numOctaves='3' seed='7' stitchTiles='stitch' result='n'/><feDiffuseLighting in='n' lighting-color='white' surfaceScale='2.4' diffuseConstant='1.05'><feDistantLight azimuth='50' elevation='58'/></feDiffuseLighting></filter><rect width='240' height='240' filter='url(%23l)'/></svg>");
  --leather-fine:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='f' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='3' stitchTiles='stitch' result='n'/><feDiffuseLighting in='n' lighting-color='white' surfaceScale='1.2' diffuseConstant='1.1'><feDistantLight azimuth='225' elevation='65'/></feDiffuseLighting></filter><rect width='120' height='120' filter='url(%23f)'/></svg>");
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .3  0 0 0 0 .15  0 0 0 .5 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  --blotch:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='4' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .36  0 0 0 0 .12  0 0 0 1.5 -.45'/></filter><rect width='400' height='400' filter='url(%23b)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 30%,#3a2a24 0%,#17100d 75%);
  font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;overflow:hidden;user-select:none;
}
.stage{perspective:2400px;width:min(92vw,calc((100dvh - 96px)*0.667),560px);aspect-ratio:2/3}
.book{position:relative;width:100%;height:100%;container-type:size;filter:drop-shadow(0 28px 34px rgba(0,0,0,.65))}
/* page block thickness */
.book::before{
  content:"";position:absolute;top:1.2%;bottom:1.2%;right:-1.7cqw;width:2.6cqw;z-index:-1;border-radius:0 3px 3px 0;
  background:repeating-linear-gradient(90deg,#eadbb2 0 .22cqw,#c3a56d .22cqw .46cqw);
  box-shadow:inset 0 0 1cqw rgba(70,35,0,.55);
}
.book.end::before{display:none}

/* ---------- AGED PAPER ---------- */
.page{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.6,.05,.2,1),opacity .3s ease .75s;
  border-radius:2px 8px 8px 2px;backface-visibility:hidden;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(60,28,4,.42) 0,rgba(60,28,4,.12) 4.5%,transparent 11%),
    radial-gradient(ellipse at 18% 8%,rgba(255,248,215,.85),transparent 55%),
    radial-gradient(circle at 88% 90%,rgba(140,85,25,.30),transparent 40%),
    radial-gradient(circle at 8% 72%,rgba(140,90,30,.16),transparent 24%),
    #ecd9a9;
  box-shadow:inset 0 0 9cqw rgba(115,65,12,.55),inset 0 0 1.8cqw rgba(80,40,5,.4);
}
.page.flipped{transform:rotateY(-165deg);opacity:0;pointer-events:none}
.page::before{ /* stains, foxing, blotches */
  content:"";position:absolute;inset:-35%;pointer-events:none;z-index:1;opacity:.7;mix-blend-mode:multiply;
  transform:rotate(var(--r,0deg));
  background:
    radial-gradient(circle at 22% 78%,rgba(125,70,20,.40) 0 .45cqw,transparent 1.3cqw),
    radial-gradient(circle at 71% 18%,rgba(125,70,20,.32) 0 .35cqw,transparent 1.1cqw),
    radial-gradient(circle at 84% 63%,rgba(125,70,20,.30) 0 .3cqw,transparent .95cqw),
    radial-gradient(circle at 40% 31%,rgba(125,70,20,.22) 0 .25cqw,transparent .8cqw),
    radial-gradient(circle at 12% 40%,rgba(125,70,20,.28) 0 .3cqw,transparent 1cqw),
    var(--blotch);
  background-size:auto,auto,auto,auto,auto,70cqw 70cqw;
}
.page::after{ /* paper fibre grain */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.55;mix-blend-mode:multiply;
  background-image:var(--grain);
}
.inner{position:absolute;inset:0;padding:11cqw 10cqw 10cqw 13cqw;display:flex;flex-direction:column;justify-content:center;z-index:2}
.inner p{font-size:4.5cqw;line-height:1.5;font-weight:500;margin:0 0 3.2cqw;text-wrap:pretty}
.inner p.big{font-size:7.6cqw;line-height:1.15;font-style:italic;font-weight:600;text-align:center;color:var(--red)}
.inner p.big.ar{color:var(--blue)}
.inner p.first::first-letter{float:left;font-size:14cqw;line-height:.78;padding:.9cqw 1.4cqw 0 0;color:var(--red);font-weight:600}
.inner em{color:var(--red)}
.num{position:absolute;bottom:4cqw;left:0;right:0;text-align:center;font-size:3.3cqw;letter-spacing:.3em;color:#7d6439;z-index:3}
.deco{position:absolute;z-index:1;pointer-events:none;filter:sepia(.5) saturate(.9) contrast(.95);mix-blend-mode:multiply}
.deco svg{width:100%;height:100%;display:block}
.corner-tl{top:0;left:0;width:30cqw;height:30cqw;opacity:.9}
.corner-br{bottom:0;right:0;width:30cqw;height:30cqw;transform:rotate(180deg);opacity:.9}
.band{position:absolute;left:0;right:0;height:1.5cqw;z-index:2;opacity:.8;background:linear-gradient(90deg,#a3342a 0 50%,#6b97c0 50% 100%);filter:sepia(.4)}
.band.top{top:0}.band.bot{bottom:0}
.kicker{font-size:3.3cqw;letter-spacing:.35em;text-transform:uppercase;text-align:center;color:#8c3a2c;margin-bottom:3cqw}

/* ---------- LEATHER ---------- */
.leather{
  background:#4a2616;color:#fff;border-radius:3px 14px 14px 3px;
  box-shadow:inset 0 0 0 .25cqw rgba(0,0,0,.45),inset .6cqw 0 1.6cqw rgba(0,0,0,.5);
}
.leather::before,.leather::after{display:none}
.leather .tex,.leather .tex2,.leather .vig{position:absolute;inset:0;pointer-events:none}
.leather .tex{background:var(--leather-tex);background-size:230px;mix-blend-mode:overlay;opacity:.8}
.leather .tex2{background:var(--leather-fine);background-size:110px;mix-blend-mode:soft-light;opacity:.7}
.leather .vig{
  background:
    radial-gradient(ellipse at 30% 18%,rgba(255,205,150,.30),transparent 55%),
    radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(15,5,0,.62) 100%),
    radial-gradient(circle at 0 0,rgba(210,150,90,.34),transparent 9cqw),
    radial-gradient(circle at 100% 0,rgba(210,150,90,.30),transparent 9cqw),
    radial-gradient(circle at 100% 100%,rgba(210,150,90,.36),transparent 10cqw),
    radial-gradient(circle at 0 100%,rgba(210,150,90,.28),transparent 9cqw),
    linear-gradient(112deg,transparent 40%,rgba(255,220,170,.10) 46%,transparent 52%);
}
.leather .spine{position:absolute;left:0;top:0;bottom:0;width:9cqw;
  background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.22) 70%,rgba(255,210,150,.14) 88%,rgba(0,0,0,.45) 100%)}
.leather .groove{position:absolute;left:9cqw;top:0;bottom:0;width:.9cqw;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,215,160,.22));}
.leather .stitch{position:absolute;left:12.5cqw;right:4.5cqw;top:4.5cqw;bottom:4.5cqw;border:.55cqw dashed rgba(238,216,170,.78);border-radius:2cqw;filter:drop-shadow(0 .15cqw .15cqw rgba(0,0,0,.7))}
.gold{
  background:linear-gradient(180deg,#fff2b4 0%,#edbe52 38%,#a8721a 54%,#f3d377 78%,#9a6412 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .18cqw 0 rgba(35,12,0,.85)) drop-shadow(0 0 .7cqw rgba(0,0,0,.45));
}
.lcorner{position:absolute;width:13cqw;height:13cqw;z-index:3;filter:drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.7))}
.lcorner.tl{left:11.5cqw;top:3.5cqw}
.lcorner.tr{right:3.5cqw;top:3.5cqw;transform:rotate(90deg)}
.lcorner.br{right:3.5cqw;bottom:3.5cqw;transform:rotate(180deg)}
.lcorner.bl{left:11.5cqw;bottom:3.5cqw;transform:rotate(270deg)}
.lcorner svg{width:100%;height:100%;display:block}

/* COVER */
.cover .ctitle{position:absolute;left:12cqw;right:4cqw;top:9.5cqw;text-align:center;z-index:4}
.cover .tagc{font-size:2.4cqw;letter-spacing:.2em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.cover h1{font-size:12.6cqw;line-height:.94;font-style:italic;font-weight:600;margin-top:2.6cqw}
.cover .div{width:34cqw;height:5cqw;margin:2.2cqw auto 0}
.cframe{
  position:absolute;left:22cqw;top:26cqw;width:66cqw;height:66cqw;padding:2.2cqw;z-index:4;
  background:#efe3c6;transform:rotate(-1.8deg);
  box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.7),inset 0 0 1.2cqw rgba(120,80,20,.45);
  outline:.45cqw solid #d9a93f;outline-offset:1.2cqw;
}
.cframe .ph{display:block;width:100%;height:100%;object-fit:cover;filter:sepia(.2) contrast(1.04) saturate(.92);box-shadow:inset 0 0 1cqw rgba(0,0,0,.4)}
.cpin{position:absolute;right:-9cqw;bottom:-9cqw;width:21cqw;height:auto;transform:rotate(11deg);filter:drop-shadow(0 .8cqw .9cqw rgba(0,0,0,.65));z-index:5}
.logoplaque{position:absolute;z-index:1;border-radius:1.8cqw;overflow:hidden;border:.45cqw solid #b9892b;box-shadow:0 1cqw 2cqw rgba(60,30,0,.55);pointer-events:none}
.logoplaque img{display:block;width:100%;height:auto}
.pinimg{position:absolute;z-index:3;height:auto;filter:drop-shadow(0 .6cqw .7cqw rgba(50,25,0,.55));pointer-events:none}
.cover .from,.cover .to{position:absolute;left:12cqw;right:4cqw;text-align:center;font-family:'Caveat',cursive;font-weight:700;z-index:4}
.cover .from{top:103cqw;font-size:9cqw}
.cover .to{top:115cqw;font-size:11cqw}
.cover .where{position:absolute;left:12cqw;right:4cqw;top:129.5cqw;text-align:center;font-size:3cqw;letter-spacing:.26em;text-transform:uppercase;font-weight:600;z-index:4}
.cover .open{position:absolute;left:12cqw;right:4cqw;top:136.5cqw;text-align:center;font-size:2.9cqw;letter-spacing:.3em;text-transform:uppercase;color:#f1dcae;animation:pulse 2.2s infinite;z-index:4;text-shadow:0 .15cqw .3cqw rgba(0,0,0,.8)}
@keyframes pulse{50%{opacity:.35}}

/* BACK */
.back .bc{position:absolute;left:12cqw;right:4cqw;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4}
.back .bc .em{width:28cqw;height:28cqw;margin-bottom:7cqw}
.bframe{width:64cqw;padding:2.2cqw;margin-bottom:9cqw;background:#efe3c6;transform:rotate(1.6deg);box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.7),inset 0 0 1.2cqw rgba(120,80,20,.45);outline:.45cqw solid #d9a93f;outline-offset:1.2cqw}
.bframe img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:sepia(.2) contrast(1.04) saturate(.92)}
.back .bc .l1{font-size:6.6cqw;white-space:nowrap;font-style:italic;font-weight:600}
.back .bc .l2{font-family:'Caveat',cursive;font-size:7cqw;font-weight:700;margin-top:3cqw}

/* PHOTO PLATE */
.plate{position:absolute;inset:0;padding:12cqw 9cqw 12cqw 13cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.snap{position:relative;width:72cqw;background:#f6efdc;padding:3cqw 3cqw 9cqw;transform:rotate(-1.6deg);margin:2cqw 0 5cqw;
  box-shadow:0 1.2cqw 2.6cqw rgba(60,30,0,.5),0 0 0 .2cqw rgba(0,0,0,.1)}
.snap img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:sepia(.22) contrast(1.04) saturate(.9)}
.snap figcaption{position:absolute;left:0;right:0;bottom:2.1cqw;text-align:center;font-family:'Caveat',cursive;font-size:5.4cqw;font-weight:700;color:#5b3a22}
.tape{position:absolute;width:16cqw;height:5cqw;top:-2.4cqw;background:rgba(226,206,150,.7);box-shadow:0 .2cqw .5cqw rgba(0,0,0,.25)}
.tape.t1{left:-4.5cqw;transform:rotate(-38deg)}
.tape.t2{right:-4.5cqw;transform:rotate(36deg)}
.datefoot{position:absolute;left:0;right:0;bottom:10.5cqw;text-align:center;font-family:'Caveat',cursive;font-size:6cqw;font-weight:700;letter-spacing:.18em;color:#7a3b22;z-index:3}
.plate .cap{font-family:'Caveat',cursive;font-size:6.6cqw;font-weight:700;color:var(--blue);text-align:center;line-height:1.1}
.pinrow{display:flex;align-items:center;gap:3cqw;margin-top:4cqw;font-family:'Caveat',cursive;font-size:5cqw;color:#6b4a2a}
.pinrow img{width:17cqw;height:auto;transform:rotate(-8deg);filter:drop-shadow(0 .5cqw .6cqw rgba(50,25,0,.55))}

/* controls */
.ui{margin-top:14px;display:flex;gap:18px;align-items:center;color:#e6d2a6;font-size:15px;letter-spacing:.15em}
.ui button{background:rgba(255,230,180,.08);border:1px solid rgba(240,210,150,.35);color:#f3e1b4;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;transition:.2s}
.ui button:hover{background:rgba(217,169,63,.3)}
.ui button:disabled{opacity:.25;cursor:default}
.hit{position:absolute;top:0;bottom:0;width:30%;z-index:20;cursor:pointer}
.hit.l{left:0}.hit.r{right:0}
@media (prefers-reduced-motion:reduce){.page{transition-duration:.01s}.open{animation:none}}
</style>
</head>
<body>

<div class="stage"><div class="book" id="book"></div></div>
<div class="ui">
  <button id="prev" aria-label="Página anterior">‹</button>
  <span id="count">Portada</span>
  <button id="next" aria-label="Página siguiente">›</button>
</div>

/* ---------- Render + logic ---------- */
const book=document.getElementById('book');
const last=pages.length-1;
const els=pages.map((p,i)=>{
  const d=document.createElement('section');
  d.className='page '+(p.cls||'');
  d.style.zIndex=pages.length-i;
  d.style.setProperty('--r',((i*47)%360)+'deg');
  d.innerHTML=p.html+(p.bare?'':`<div class="num">· ${i} ·</div>`);
  book.appendChild(d);
  return d;
});
const hl=document.createElement('div');hl.className='hit l';
const hr=document.createElement('div');hr.className='hit r';
book.append(hl,hr);

let cur=0;
const count=document.getElementById('count');
const prev=document.getElementById('prev'),next=document.getElementById('next');
function update(){
  els.forEach((e,i)=>e.classList.toggle('flipped',i<cur));
  book.classList.toggle('end',cur===last);
  count.textContent=cur===0?'Portada':cur===last?'Fin':`${cur} / ${last-1}`;
  prev.disabled=cur===0;next.disabled=cur===last;
}
const go=d=>{cur=Math.max(0,Math.min(last,cur+d));update()};
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
hl.onclick=()=>go(-1);hr.onclick=()=>go(1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  if(e.key==='ArrowLeft')go(-1);
});
let sx=null;
book.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
book.addEventListener('touchend',e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>40)go(dx<0?1:-1);sx=null;
});
update();
</script>
